[platformio]
default_envs = native

[env]
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wpedantic
build_unflags = -std=gnu++11

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<core/*.cpp> +<native/*.cpp>
build_flags =
  ${env.build_flags}
  -D LOGGER_NATIVE

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<core/core.cpp> +<core/types.cpp> +<esp32/*.cpp>
lib_deps =
  adafruit/Adafruit BME280 Library@^2.2.4
  adafruit/RTClib@^2.1.4
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -D LOGGER_ESP32

